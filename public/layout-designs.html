</style></head><body><header class="studio"><div><small>41 REAL ESTATE / LAYOUT STUDIO</small><h1>Choose your website layout</h1></div><nav class="choices" aria-label="Layout concepts"><button class="active" data-layout="0">01 · Soft Sage</button><button data-layout="1">02 · Warm Sand</button><button data-layout="2">03 · Mist Blue</button></nav></header>
<div class="label" id="description">01 / Soft Sage — muted green, gentle ivory and soft natural accents.</div><div id="concepts"></div><footer class="note">Layout preview only. Illustrations, listings and map positions are demo content. Category tabs and search work within each concept. Your live site is unchanged.</footer>
<script>
const demos=[{title:'A home above the city',type:'apartment',kind:'Apartment',area:'Al Yasmin, Riyadh',details:'3 rooms · 2 bathrooms',price:'32,000',period:'/ year'},{title:'An investment with potential',type:'build',kind:'Building',area:'Al Malqa, Riyadh',details:'8 apartments · 540 m²',price:'2,400,000',period:''},{title:'Space for your vision',type:'land',kind:'Land',area:'Al Narjis, Riyadh',details:'600 m² · North facing',price:'680,000',period:''}];
const brand='<div class="brand"><em>41</em> Real Estate</div>',language='<button class="language" type="button">العربية / EN</button>';
function nav(){return '<nav class="nav" aria-label="Property categories"><button class="active" data-category="all">◈ All listings</button><button data-category="apartment">⌂ Apartments</button><button data-category="build">▤ Buildings</button><button data-category="land">◇ Lands</button></nav>'}
function content(i){return `<div class="hero"><div><span class="eyebrow">Your next chapter starts here</span><h2>${i===0?'Find a place.<br>Make it yours.':i===1?'Good spaces.<br>Better possibilities.':'Properties with a sense of place.'}</h2><p>Explore apartments, buildings and land. Thoughtfully organised to help you find the right opportunity.</p></div>${i<2?'<div class="art" aria-label="Architectural illustration"></div>':''}</div>${i===2?nav():''}<div class="filters"><input aria-label="Search listings" placeholder="Search by property or location…"><select aria-label="Availability"><option>Available</option><option>Any availability</option></select><select aria-label="Listing type"><option>Sale & rent</option><option>For sale</option><option>For rent</option></select><button data-reset>Reset filters</button></div><div class="results"><strong>Available opportunities</strong><span class="count">3 demo properties</span></div><div class="grid"></div><div class="pages"><button aria-current="page">1</button></div><div class="map-title"><h3>Find your place on the map.</h3><span>Your chosen Navigator map / Design 2</span></div><div class="map-shell"><aside class="map-list"><span class="eyebrow">Location finder</span><h4>Places with potential.</h4><p>A home above the city<br><strong>SAR 32,000 / year</strong></p><p>An investment with potential<br><strong>SAR 2,400,000</strong></p><p>Space for your vision<br><strong>SAR 680,000</strong></p></aside><div class="map-scene" aria-label="Illustrative Navigator map"><span class="pin one">32K SAR</span><span class="pin two">2.4M SAR</span><span class="pin three">680K SAR</span></div></div>`}
const root=document.getElementById('concepts');root.innerHTML=`<section class="concept active layout-one"><header class="one-header">${brand}${nav()}${language}</header><main class="one-main">${content(0)}</main></section><section class="concept layout-two"><aside class="two-sidebar">${brand}${nav()}<div class="sidebar-bottom">Office workspace<br><br>Account & settings ↗</div></aside><main class="two-content"><div class="two-top"><span>BROWSE / PROPERTY COLLECTION</span>${language}</div>${content(1)}</main></section><section class="concept layout-three"><header class="three-header">${brand}<small class="eyebrow">A collection of possibilities</small>${language}</header><main class="three-main">${content(2)}</main></section>`;
function card(p){return `<article class="card"><div class="image ${p.type}"><div class="building"></div><span class="badge">${p.kind} · ${p.type==='apartment'?'For rent':'For sale'}</span></div><div class="card-body"><small>${p.area}</small><h3>${p.title}</h3><p>${p.details}</p><div class="price"><div>${p.price} <span>SAR ${p.period}</span></div><button aria-label="Preview ${p.title}" data-preview="${p.type}">↗</button></div></div></article>`}
root.querySelectorAll('.concept').forEach(section=>{let category='all';function render(){const listing=section.querySelectorAll('select')[1].value;section.querySelectorAll('select')[1].hidden=category==='land';const query=section.querySelector('input').value.trim().toLowerCase(),found=demos.filter(p=>(category==='all'||p.type===category)&&(category==='land'||listing==='Sale & rent'||(listing==='For rent'?p.type==='apartment':p.type!=='apartment'))&&[p.title,p.area,p.kind].join(' ').toLowerCase().includes(query));section.querySelector('.grid').innerHTML=found.map(card).join('')||'<p class="empty">No demo properties match. Reset the filters to browse again.</p>';section.querySelector('.count').textContent=found.length+' demo properties';section.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{const p=demos.find(p=>p.type===b.dataset.preview);alert(p.title+'\n'+p.area+'\nSAR '+p.price+' '+p.period+'\n\nDesign preview only.');})}section.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;section.querySelectorAll('[data-category]').forEach(n=>n.classList.toggle('active',n===b));render()});section.querySelector('input').oninput=render;section.querySelectorAll('select').forEach(s=>s.onchange=render);section.querySelector('[data-reset]').onclick=()=>{category='all';section.querySelector('input').value='';section.querySelectorAll('select').forEach(s=>s.selectedIndex=0);section.querySelectorAll('[data-category]').forEach(n=>n.classList.toggle('active',n.dataset.category==='all'));render()};section.querySelector('.language').onclick=()=>alert('The live implementation will use your existing English / Arabic language support.');render()});
const descriptions=['01 / Soft Sage — muted green, gentle ivory and soft natural accents.','02 / Warm Sand — oatmeal, taupe and warm off-white.','03 / Mist Blue — dusty blue, pale grey and cloud white.'];document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.layout);root.querySelectorAll('.concept').forEach((s,i)=>s.classList.toggle('active',i===n));document.querySelectorAll('[data-layout]').forEach(s=>s.classList.toggle('active',s===b));document.getElementById('description').textContent=descriptions[n]});
</script></body></html>
