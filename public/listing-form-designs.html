<header class="studio"><div><small>41 REAL ESTATE / FORM DESIGN STUDY</small><h1>A better way to add a property.</h1></div><div class="tabs" id="design-tabs" aria-label="Design direction"><button aria-pressed="true" data-design="0">01 · Guided</button><button aria-pressed="false" data-design="1">02 · Editorial</button><button aria-pressed="false" data-design="2">03 · Workspace</button></div></header>
<div class="context"><div class="tabs" id="category-tabs" aria-label="Listing category"><button aria-pressed="true" data-category="apartment">Apartment</button><button aria-pressed="false" data-category="build">Building</button><button aria-pressed="false" data-category="land">Land</button></div><p>Interactive preview · Fictional users · Nothing is saved to your system</p></div><p class="note" id="note"></p><main id="app"></main><div id="toast" class="toast" role="status" hidden></div>
<script>
const names=['Guided','Editorial','Workspace'],notes=['A calm, step-by-step form with a live listing summary. Focus on one decision at a time.','A warm editorial form that matches your property view. All sections on one page, with generous spacing.','A compact office workspace with section navigation and a live summary. Built for frequent data entry.'];
let design=1,category='apartment',step=0,unitCount=0,toastTimer;
const state={apartment:{title:'Garden apartment in Al Yasmin',description:'A bright home with three rooms, a spacious living area, and an installed kitchen.',type:'apartment',person:'Ali',sale:'rent',price:'48,000',hasPrice:true,available:true,public:true,details:true,owner:false,map:'',period:'yearly'},build:{title:'Residential building in Al Narjis',description:'A well-maintained residential building with independent apartments and easy road access.',type:'apartment',person:'Khalid',sale:'sale',price:'3,200,000',hasPrice:true,available:true,public:true,details:false,owner:false,map:'',period:'yearly'},land:{title:'Residential plot in Al Qairawan',description:'A residential plot in an established neighborhood with convenient access to main roads.',type:'apartment',person:'Abu Ghazi',sale:'sale',price:'950,000',hasPrice:false,available:true,public:true,details:false,owner:false,map:'',period:'yearly'}};
const initialState=structuredClone(state);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles={apartment:'New apartment listing',build:'New building listing',land:'New land listing'}, typeNames={villa:'Villa',apartment:'Apartment',duplex:'Duplex',floor:'Floor / story',shop:'Shop',other:'Other'};
function input(label,key,value,placeholder='',wide=false){value=state[category][key]??value;return `<div class="${wide?'wide':''}"><label class="field" for="${key}">${label}</label><input id="${key}" data-key="${key}" value="${esc(value)}" placeholder="${placeholder}"></div>`}
function select(label,key,items,value){return `<div><label class="field" for="${key}">${label}</label><select id="${key}" data-key="${key}">${items.map(([v,n])=>`<option value="${v}" ${v===value?'selected':''}>${n}</option>`).join('')}</select></div>`}
function toggle(label,key,checked){checked=state[category][key]??checked;return `<div class="switch-row"><label for="${key}">${label}</label><input id="${key}" class="switch" type="checkbox" role="switch" data-key="${key}" ${checked?'checked':''}></div>`}
function panel(n,title,sub,content){return `<section class="panel" id="section-${n}"><h3><span class="section-no">0${n+1}</span>${title}</h3><p class="sub">${sub}</p>${content}</section>`}
function sections(){const s=state[category];return [panel(0,'The essentials','Start with a clear title and the offer information.',`<div class="fields">${input('Listing title','title',s.title,'Give this property a name',true)}${category==='apartment'?select('Property type','type',Object.entries(typeNames),s.type):''}${select('Offer brought by','person',[['','Select a system user'],['Ali','Ali'],['Khalid','Khalid'],['Abu Ghazi','Abu Ghazi']],s.person)}<div class="wide"><label class="field" for="description">Description</label><textarea id="description" data-key="description">${esc(s.description)}</textarea><p class="hint">Describe the property in the language you want buyers to read.</p></div><div><label class="field">Listing type</label>${category==='land'?'<div class="segment"><button type="button" class="selected" disabled>For sale only</button></div><p class="hint">Land listings are for sale.</p>':`<div class="segment"><button type="button" data-sale="sale" class="${s.sale==='sale'?'selected':''}" aria-pressed="${s.sale==='sale'}">For sale</button><button type="button" data-sale="rent" class="${s.sale==='rent'?'selected':''}" aria-pressed="${s.sale==='rent'}">For rent</button></div>`}</div><div>${toggle('I have a price','hasPrice',s.hasPrice)}${s.hasPrice?`<div class="conditional">${input('Price · SAR','price',s.price)}</div>`:'<p class="hint">Show “Price on request” on the property page.</p>'}</div>${s.sale==='rent'?select('Rental period','period',[['monthly','Monthly'],['yearly','Yearly']],s.period):''}<div>${toggle('Available','available',s.available)}<p class="hint">${s.available?'Accepting inquiries.':s.sale==='rent'?'Marked as rented.':'Marked as sold.'}</p></div><div>${toggle('Public listing','public',s.public)}<p class="hint">${s.public?'Visible to website visitors.':'Visible to signed-in staff only.'}</p></div></div>`),panel(1,category==='build'?'Details & apartments':'Property details',category==='land'?'Land listings keep the form simple. Continue with the location.':'Add the details you know. Optional information can stay empty.',category==='land'?'<p class="empty">Room and apartment fields do not apply to land.</p>':`<div>${toggle('Add property details','details',s.details)}${s.details?`<div class="fields conditional">${input('Rooms','rooms','3')}${input('Bathrooms','bathrooms','2')}<div>${toggle('Kitchen','kitchen',true)}</div><div>${toggle('AC installed','ac',true)}</div><div>${toggle('Kitchen cabinets installed','cabinets',true)}</div></div>`:''}</div>${category==='build'?`<div id="units">${Array.from({length:unitCount},(_,i)=>unit(i+1)).join('')}</div><button type="button" class="secondary" data-add-unit style="margin-top:20px">＋ Add apartment</button><p class="hint">Use the apartment number as its name. Mark each rented apartment separately.</p>`:''}`),panel(2,'Location & owner','Paste the location link and add owner information when available.',`<div class="fields">${input('Location URL','map',s.map,'https://maps.google.com/…',true)}${input('City','city','Riyadh')}${input('District','district',category==='land'?'Al Qairawan':category==='build'?'Al Narjis':'Al Yasmin')}${input('Address (optional)','address','','Street / building',true)}<div class="wide map"><span>⌖ ${s.map?'Location link added · preview placeholder':'Map preview placeholder'}</span></div><div class="wide">${toggle('I have owner information','owner',s.owner)}</div>${s.owner?`${input('Owner name','ownerName','','Full name')}${input('Phone number','ownerPhone','','+966…')}${input('Email (optional)','ownerEmail','','name@example.com')}${input('Notes (optional)','ownerNotes','','Office notes')}`:''}</div>`),panel(3,'Photos & video','Give the listing a visual story. Media is optional.',`<div class="fields"><label class="upload wide"><strong>＋ Add property photos</strong><span style="font-size:11px">Choose photos from your device</span><input type="file" accept="image/*" multiple id="photos"><span id="file-count" class="hint"></span></label>${input('Image URL (optional)','imageUrl','','https://…',true)}${input('TikTok video URL (optional)','tiktok','','https://www.tiktok.com/…',true)}<p class="hint wide">This prototype accepts file selections locally. It does not upload files.</p></div>`),panel(4,'Ready for review','Check the main information before creating your listing.',`<div>${[['Listing title',s.title],['Property type',category==='apartment'?typeNames[s.type]:category==='build'?'Building':'Land'],['Offer brought by',s.person||'Not selected'],['Listing type',s.sale==='rent'?'For rent':'For sale'],['Price',s.hasPrice?s.price+' SAR':'Price on request'],['Availability',s.available?'Available':s.sale==='rent'?'Rented':'Sold'],['Visibility',s.public?'Public':'Staff only']].map(([k,v])=>`<div class="review-row"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`)];}
function unit(n){return `<div class="unit"><header><strong>Apartment ${n}</strong><button type="button" class="remove" data-remove-unit>Remove</button></header><div class="fields">${input('Apartment number','unit-'+n,n)}<div>${toggle('Apartment is rented','rented-'+n,false)}</div>${input('Rooms','unit-rooms-'+n,'2')}${input('Bathrooms','unit-baths-'+n,'1')}</div><div class="tenant-fields ${state[category]['rented-'+n]?'':'hidden'}" id="tenant-${n}"><div class="fields conditional">${input('Tenant name','tenant-name-'+n,'')}${input('Tenant phone','tenant-phone-'+n,'')}</div></div></div>`}
function sketch(){return `<svg viewBox="0 0 100 90" aria-hidden="true">${category==='land'?'<path d="M10 56 50 34 90 53 48 77Z M10 56V43l40-22 40 19v13 M50 21v13 M48 77V64"/>':category==='build'?'<path d="M22 82V12h56v70M10 82h80M33 25h9v10h-9Zm25 0h9v10h-9ZM33 43h9v10h-9Zm25 0h9v10h-9ZM33 61h9v10h-9Zm25 0h9v10h-9Z"/>':'<path d="M10 43 50 12l40 31M20 35v43h60V35M43 78V54h15v24M28 44h9v10h-9Zm36 0h9v10h-9Z"/>'}</svg>`}
function summary(){const s=state[category];return `<aside class="summary"><h3>LISTING SNAPSHOT</h3><div class="sketch">${sketch()}</div><h4 id="summary-title">${esc(s.title)}</h4><p>${category==='apartment'?typeNames[s.type]:category==='build'?'Building':'Land'} · ${s.sale==='rent'?'For rent':'For sale'}</p><hr><strong id="summary-price">${s.hasPrice?esc(s.price)+' SAR':'Price on request'}</strong><dl><dt>Availability</dt><dd>${s.available?'Available':s.sale==='rent'?'Rented':'Sold'}</dd><dt>Visibility</dt><dd>${s.public?'Public':'Staff only'}</dd><dt>Offer source</dt><dd>${esc(s.person||'—')}</dd>${category==='build'?`<dt>Apartments</dt><dd>${unitCount}</dd>`:''}</dl><hr><p>Preview only. These sample users will be replaced by your system users in the final implementation.</p>${design===0?`<div class="progress"><div style="width:${(step+1)*20}%"></div></div><p>Step ${step+1} of 5</p>`:''}</aside>`}
function render(){document.body.className=['guided','editorial','workspace'][design];document.getElementById('note').textContent=names[design]+' — '+notes[design];document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.design)===design));document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===category));const list=sections(),labels=['Essentials',category==='build'?'Apartments':'Details','Location & owner','Photos & video','Review'];document.getElementById('app').innerHTML=`<div class="shell"><div class="brand">41 / REAL ESTATE <span>OFFICE → LISTINGS → NEW ${category.toUpperCase()}</span></div><div class="intro"><div><div class="eyebrow">A new opportunity</div><h2>${titles[category]}</h2><p>${design===0?'A few clear steps. A listing ready to share.':design===1?'Tell the story. Add the details. Bring the property to life.':'Everything your office needs, in one place.'}</p></div>${design===2?'<span class="badge">New listing · Not saved</span>':''}</div><form id="preview-form" class="layout" novalidate><nav class="rail" aria-label="Form sections">${labels.map((l,i)=>`<button type="button" data-step="${i}" class="${step===i?'active':''}" ${step===i?'aria-current="step"':''}><span class="num">${i+1}</span>${l}</button>`).join('')}</nav><div class="${design===0?'':'all-sections'}">${design===0?list[step]:list.join('')}<div class="actions"><button type="button" class="secondary" data-back>${design===0&&step>0?'← Back':'Reset preview'}</button><span class="hint">${design===0?`0${step+1} / 05`:'Demo · no data saved'}</span><button type="${design===0&&step<4?'button':'submit'}" class="primary" ${design===0&&step<4?'data-next':''}>${design===0&&step<4?'Continue →':'Create listing →'}</button></div></div>${summary()}</form></div>`;}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.design!==undefined){design=Number(b.dataset.design);step=0;render()}else if(b.dataset.category){category=b.dataset.category;step=0;unitCount=0;render()}else if(b.dataset.step!==undefined){step=Number(b.dataset.step);if(design===0)render();else{document.querySelectorAll('[data-step]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('section-'+step).scrollIntoView({behavior:'smooth',block:'start'})}}else if(b.dataset.sale){state[category].sale=b.dataset.sale;render()}else if(b.hasAttribute('data-next')){step++;render();document.getElementById('app').scrollIntoView({behavior:'smooth'})}else if(b.hasAttribute('data-back')){if(design===0&&step>0){step--;render()}else{state[category]=structuredClone(initialState[category]);unitCount=0;notify('Sample data restored.');step=0;render()}}else if(b.hasAttribute('data-add-unit')){unitCount++;render()}else if(b.hasAttribute('data-remove-unit')){unitCount=Math.max(0,unitCount-1);render()}});
document.addEventListener('input',e=>{const el=e.target,key=el.dataset.key;if(!key)return;state[category][key]=el.type==='checkbox'?el.checked:el.value;if(key==='title'){const target=document.getElementById('summary-title');if(target)target.textContent=el.value}if(key==='price'){el.value=el.value.replace(/[^0-9.]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');state[category].price=el.value;const target=document.getElementById('summary-price');if(target)target.textContent=el.value+' SAR'}});
document.addEventListener('change',e=>{const el=e.target,key=el.dataset.key;if(el.id==='photos'){document.getElementById('file-count').textContent=el.files.length+' photo(s) selected';return}if(key?.startsWith('rented-')){document.getElementById('tenant-'+key.split('-')[1]).classList.toggle('hidden',!el.checked);return}if(['hasPrice','available','public','details','owner','type','person','period'].includes(key))render()});
document.addEventListener('submit',e=>{e.preventDefault();notify('Design '+(design+1)+' · '+names[design]+': demo reviewed. Tell me this design number to use it in your app.')});render();
</script></body></html>
