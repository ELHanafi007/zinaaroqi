 return `<svg viewBox="0 0 860 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated ${type}, sample concept image"><defs><linearGradient id="sky${variant}" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="#eff0d8"/></linearGradient></defs><rect width="860" height="480" fill="url(#sky${variant})"/><circle cx="710" cy="89" r="41" fill="#f5efd5" opacity=".75"/><path d="M0 240 120 211 213 242 700 214 860 237v243H0" fill="#d5d5b8"/><path d="M0 390 245 328 860 414v66H0" fill="#b5bfa3"/><path d="M0 439 272 367 860 451v29H0" fill="#e5e0ce"/>${structure}<path d="M0 416 186 383" stroke="#f6f0de" stroke-width="5"/><g stroke="#667951" stroke-width="7"><path d="M112 356v-152m606 167V198"/></g><g fill="#7c8f61"><ellipse cx="112" cy="212" rx="40" ry="18"/><ellipse cx="83" cy="202" rx="35" ry="13" transform="rotate(30 83 202)"/><ellipse cx="143" cy="201" rx="36" ry="13" transform="rotate(-30 143 201)"/><ellipse cx="718" cy="207" rx="41" ry="18"/><ellipse cx="690" cy="195" rx="34" ry="13" transform="rotate(30 690 195)"/><ellipse cx="749" cy="195" rx="36" ry="13" transform="rotate(-30 749 195)"/></g><g fill="#869777"><ellipse cx="90" cy="379" rx="58" ry="18"/><ellipse cx="717" cy="389" rx="53" ry="17"/></g><path d="M770 481h90V313l-19-9-30 7Z" fill="#637b65" opacity=".5"/></svg>`;
}
function nav(){return `<nav class="nav" aria-label="Concept navigation"><div class="brand"><div class="brand-mark">41</div><div><strong>41 Real Estate</strong><small>العقارات، برؤية مختلفة</small></div></div><div class="nav-links"><span>Properties</span><span>Our story</span><span>Get in touch</span><button class="nav-contact" onclick="demo('Office contact options would open here.')">Contact our team ${icon('arrow')}</button></div></nav>`;}
function breadcrumb(){return `<div class="breadcrumb">Properties <span>›</span> ${listings[category].category} <span>›</span><span>${listings[category].short}</span></div>`;}
function badges(){const p=listings[category];return `<div class="tag-row"><span class="pill">${p.category}</span><span class="pill gold">${p.type}</span><span class="pill available">● ${p.status}</span></div>`;}
function tools(){return `<div class="tools"><button class="tool" aria-label="${saved?'Unsave':'Save'} property" aria-pressed="${saved}" onclick="saved=!saved;render()">${icon('heart')}</button><button class="tool" aria-label="Share property" onclick="demo('Share would include the property link and its location.')">${icon('share')}</button></div>`;}
function title(){const p=listings[category];return `<div class="heading"><div>${badges()}<h1 class="title">${p.short}</h1><p class="location">${icon('pin')}${p.location}</p></div>${tools()}</div>`;}
function facts(){return `<div class="facts">${listings[category].facts.map(f=>`<div class="fact">${icon(f[0])}<div><strong>${f[1]}</strong><small>${f[2]}</small></div></div>`).join('')}</div>`;}
function agent(){return `<div class="agent"><div class="avatar">41</div><div><strong>41 Real Estate Office</strong><small>Your local property team</small></div></div>`;}
function actions(){return `<div class="actions"><button class="primary" onclick="demo('WhatsApp would open with a formatted property message.')">${icon('chat')}Contact on WhatsApp</button><button class="secondary" onclick="demo('This would call the office phone number.')">${icon('phone')}Call our office</button></div>`;}
function price(){const p=listings[category];return `<div class="eyebrow">${p.price?'Asking price':'Let’s talk details'}</div><div class="price" style="${!p.price?'font-size:27px;letter-spacing:-.8px':''}">${p.price?`${p.price}<span>SAR ${p.period}</span>`:'Price on request'}</div><p class="price-note">${p.note}</p>`;}
function card(){return `<aside class="price-card">${price()}<div class="divider"></div>${agent()}${actions()}<p class="fine">Have a question? We’ll help you understand<br>the details before your next step.</p></aside>`;}
function about(){const p=listings[category];return `<section class="section"><h2>About this ${category==='build'?'building':category}</h2><p>${p.description}</p><div class="amenities">${p.amenities.map(a=>`<span class="amenity">${icon('check')}${a}</span>`).join('')}</div>${p.video?`<button class="secondary" style="width:auto;margin-top:18px" onclick="demo('The property’s TikTok tour would open here.')">${icon('video')}Watch the property tour ${icon('arrow')}</button>`:''}</section>`;}
function map(){return `<section class="section"><h2>A place to call your own</h2><p>${listings[category].location} · Map preview</p><div class="map"><svg viewBox="0 0 600 200" aria-label="Illustrated neighborhood, sample location"><rect width="600" height="200" fill="#e5eadc"/><g fill="#d7dfc7"><rect x="24" y="17" width="126" height="55" rx="7"/><rect x="180" y="16" width="138" height="63" rx="7"/><rect x="390" y="20" width="180" height="50" rx="7"/><rect x="26" y="112" width="125" height="68" rx="7"/><rect x="185" y="113" width="131" height="67" rx="7"/><rect x="391" y="114" width="105" height="66" rx="7"/></g><path d="M0 93h600M164 0v200M357 0v200" stroke="#fafbf3" stroke-width="16"/><path d="M0 93h600M357 0v200" stroke="#e1dccc" stroke-width="2" stroke-dasharray="6 5"/><circle cx="270" cy="59" r="22" fill="#325c4b" opacity=".12"/><circle cx="270" cy="59" r="11" fill="#325c4b"/><circle cx="270" cy="59" r="4" fill="white"/><text x="412" y="46" font-family="Arial" fill="#9aa48c" font-size="11">NEIGHBORHOOD PARK</text></svg><button class="secondary" onclick="demo('Open location would launch Google Maps at the saved address.')">${icon('pin')}Open location ${icon('arrow')}</button></div></section>`;}
function units(){return category!=='build'?'':`<section class="section"><h2>Apartment availability</h2><p>8 apartments · 5 available · 3 rented</p><div class="unit-list">${[1,2,3].map((n)=>`<div class="unit"><strong>Apartment ${n}</strong><small>${n+1} rooms · 2 bathrooms</small><span class="pill ${n===3?'gold':'available'}">${n===3?'Rented':'Available'}</span></div>`).join('')}</div><small style="display:block;margin-top:10px;color:var(--muted)">Showing 3 of 8 apartments</small></section>`;}
function photo(variant=0,extra=''){return `<div class="photo ${extra}">${illustration(category,variant)}</div>`;}
function gallery(){return `<div class="gallery"><div class="photo main-photo">${illustration(category)}<span class="photo-label">${icon('camera')}Concept imagery</span><button class="view-photos" onclick="showPhoto(0)">${icon('camera')}View full image</button></div><div class="side-photos">${photo(1)}<div class="photo">${illustration(category,2)}<button class="view-photos" onclick="showPhoto(2)">Explore gallery ${icon('arrow')}</button></div></div></div>`;}
function footer(){return `<footer class="footer"><span>41 Real Estate · Thoughtful spaces, clear decisions.</span><span>Listing ${listings[category].ref} · Updated today</span></footer>`;}
function render(){document.querySelectorAll('[role=tab]').forEach((b,i)=>b.setAttribute('aria-selected',String(i===design)));document.querySelectorAll('.category-tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',String(['apartment','build','land'][i]===category)));document.getElementById('design-note').innerHTML=`<strong>${String(design+1).padStart(2,'0')} / ${concepts[design][0]}</strong> — ${concepts[design][1]}`;const root=document.getElementById('design-content');root.setAttribute('aria-labelledby',`tab-${design}`);root.className=['','editorial','workspace'][design];
 let content='';if(design===0){content=`${title()}${gallery()}<div class="body-grid"><div>${facts()}${about()}${units()}${map()}</div>${card()}</div>`;}
 if(design===1){content=`<div class="editorial-layout"><div class="editorial-hero"><div class="photo">${illustration(category,1)}<button class="view-photos" onclick="showPhoto(1)">${icon('camera')}See the full picture</button></div></div><div class="editorial-copy">${badges()}<h1 class="title">${listings[category].title}</h1><p class="location">${icon('pin')}${listings[category].short} · ${listings[category].location}</p>${facts()}<div class="price-card">${price()}${actions()}${agent()}</div></div></div><div class="editorial-lower"><div>${about()}${units()}</div>${map()}</div>`;}
 if(design===2){content=`${title()}<div class="workspace-layout"><div class="workspace-main"><div class="work-gallery"><div class="photo">${illustration(category,angle)}</div><div class="work-strip">${[0,1,2].map(n=>`<button aria-label="Image ${n+1}" aria-pressed="${angle===n}" onclick="angle=${n};render()">${illustration(category,n)}</button>`).join('')}</div><button class="view-photos" onclick="showPhoto(angle)">${icon('area')}Full image</button></div><div class="work-panel">${facts()}</div><div class="work-panel">${about()}</div>${category==='build'?`<div class="work-panel">${units()}</div>`:''}<div class="work-panel">${map()}</div></div>${card()}</div>`;}
 root.innerHTML=`<div class="shell">${nav()}${breadcrumb()}${content}${footer()}</div><div class="sample-banner">Design concept only · Property details and illustrations are fictional · Contact actions are demonstrations</div>`;}
function setDesign(n){design=n;render()}function setCategory(c){category=c;saved=false;angle=0;render()}function showPhoto(n){document.getElementById('photo-title').textContent=listings[category].short+' · Full image';document.getElementById('large-photo').innerHTML=illustration(category,n).replace('xMidYMid slice','xMidYMid meet');document.getElementById('lightbox').showModal()}
let toastTimer;function demo(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),4000)}
document.querySelector('.design-tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();setDesign(event.key==='Home'?0:event.key==='End'?2:(design+(event.key==='ArrowRight'?1:2))%3);document.getElementById('tab-'+design).focus()});
document.getElementById('lightbox').addEventListener('click',event=>{if(event.target===event.currentTarget)event.currentTarget.close()});render();
</script>
</body>
</html>
