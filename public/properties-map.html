<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#e5e8df;font-family:Arial}.pin{background:#526d59;color:white;border:2px solid white;border-radius:8px;box-shadow:0 3px 10px #0003;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:11px;font-weight:bold}.pin.selected{background:#789378}.leaflet-popup-content h3{font-size:15px}.leaflet-popup-content a{color:#526d59}.error{padding:30px;line-height:1.6}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
function read(){try{return JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch{return {}}}
if(window.L){const map=L.map('map',{scrollWheelZoom:false}).setView([25.9,45.4],9),layer=L.layerGroup().addTo(map);let signature='',markers=new Map();L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
function update(){const data=read();document.documentElement.lang=data.locale==='ar'?'ar':'en';const next=JSON.stringify([data.pins,data.label]);if(next!==signature){signature=next;layer.clearLayers();markers.clear();const points=[];for(const p of data.pins||[]){if(!/^[a-f0-9]{24}$/i.test(p.id)||!Array.isArray(p.point)||p.point.length!==2||!p.point.every(Number.isFinite)||Math.abs(p.point[0])>90||Math.abs(p.point[1])>180)continue;const pin=document.createElement('div');pin.className='pin';pin.textContent=p.pinLabel||p.price;const content=document.createElement('div'),title=document.createElement('h3'),price=document.createElement('p'),link=document.createElement('a');title.textContent=p.title;title.dir='auto';price.textContent=p.price;link.textContent=data.label;link.href='/properties/'+p.id;link.target='_top';content.append(title,price,link);const marker=L.marker(p.point,{title:p.title,icon:L.divIcon({className:'',html:pin,iconSize:[110,34],iconAnchor:[55,34]})}).addTo(layer).bindPopup(content);markers.set(p.id,{marker,pin});points.push(p.point)}if(points.length)map.fitBounds(points,{padding:[40,40],maxZoom:15})}for(const [id,item] of markers)item.pin.classList.toggle('selected',id===data.selected);const selected=markers.get(data.selected);if(selected){map.flyTo(selected.marker.getLatLng(),15,{duration:.5});selected.marker.openPopup()}map.invalidateSize()}
window.addEventListener('hashchange',update);update()}else{const message=document.createElement('p');message.className='error';message.textContent=read().error||'Map could not load. Refresh to try again.';document.getElementById('map').append(message)}
</script></body></html>
